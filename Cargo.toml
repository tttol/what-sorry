[package]
name = "what-sorry"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
description = "A voice-first English conversation CLI that makes asking again feel safe."
license = "MIT"

[dependencies]
anyhow = "1.0.103"
clap = { version = "4.6.1", features = ["derive"] }
cpal = "0.16"
crossterm = "0.29"
ctrlc = "3.5.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11.0"
whisper-rs = { version = "0.16", features = ["metal"] }

[dev-dependencies]
rstest = "0.26.1"

[lints.clippy]
expect_used = "deny"
unwrap_used = "deny"

[lints.rust]
unsafe_code = "deny"
